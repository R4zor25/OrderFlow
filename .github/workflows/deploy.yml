name: Application release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish images, deploy active applications, or roll back one service
        type: choice
        required: true
        default: publish
        options: [publish, deploy, rollback]
      service:
        description: Application to roll back (ignored for publish/deploy)
        type: choice
        default: order-service
        options: [catalog-pricing-service, inventory-service, order-service, notification-service]
      task_definition:
        description: Full previous task-definition ARN including revision (rollback only)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}-${{ vars.ECS_CLUSTER }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate dispatch before AWS authentication
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SERVICE: ${{ inputs.service }}
          RELEASE_ARN: ${{ inputs.task_definition }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/deploy.py validate --sha "$RELEASE_SHA" --service "$RELEASE_SERVICE" --task-definition "$RELEASE_ARN"
      - name: Verify deployment helpers and workflow contract
        run: python3 -m unittest discover -s scripts/tests_deploy -v

  verify:
    needs: validate
    if: inputs.operation != 'rollback'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-pricing-service, inventory-service, order-service, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Verify using Testcontainers and coverage
        run: |
          ./mvnw -B -ntp -Pcoverage verify
          test -s target/site/jacoco/jacoco.xml
          test -s target/site/jacoco/index.html
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/failsafe-reports/
            services/${{ matrix.service }}/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: [validate, verify]
    if: >-
      github.ref == 'refs/heads/main' && inputs.operation != 'rollback'
    runs-on: ubuntu-24.04-arm
    # Each image builds in its own job, so a slow build cannot eat the release job's time or credential.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: catalog-pricing-service, context: services/catalog-pricing-service }
          - { name: inventory-service, context: services/inventory-service }
          - { name: order-service, context: services/order-service }
          - { name: notification-service, context: services/notification-service }
          - { name: keycloak, context: infra/keycloak }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Assume short-lived publishing role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
          role-duration-seconds: 1800
      - name: Log in to project registry
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - name: Check immutable image
        id: image
        env:
          RELEASE_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ matrix.name }}
        run: python3 scripts/deploy.py image-status --service "$IMAGE_NAME" --sha "$RELEASE_SHA"
      - name: Publish image when absent
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image_uri }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: [validate, verify, publish]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      ((needs.verify.result == 'success' && needs.publish.result == 'success') ||
       (inputs.operation == 'rollback' && needs.verify.result == 'skipped' &&
        needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Assume short-lived deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
          role-duration-seconds: 3600
      - name: Log in to project registry
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - name: Require all five ARM64 images
        id: images-ready
        if: inputs.operation != 'rollback'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/deploy.py verify-images --sha "$RELEASE_SHA"
      - name: Deploy active application services
        id: deploy
        if: inputs.operation == 'deploy'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/deploy.py deploy --sha "$RELEASE_SHA"
      - name: Roll back the selected application
        if: inputs.operation == 'rollback'
        env:
          RELEASE_SERVICE: ${{ inputs.service }}
          RELEASE_ARN: ${{ inputs.task_definition }}
        run: python3 scripts/deploy.py rollback --service "$RELEASE_SERVICE" --task-definition "$RELEASE_ARN"
