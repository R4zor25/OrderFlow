spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/orderflow?currentSchema=orders
    username: orderflow
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}

order:
  outbox:
    relay:
      enabled: true
