spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ORDER_JWT_ISSUER_URI}
          jwk-set-uri: ${ORDER_JWT_JWK_SET_URI}
      client:
        registration:
          catalog-pricing:
            provider: keycloak
            client-id: order-service
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: pricing.quote
        provider:
          keycloak:
            token-uri: ${ORDER_TOKEN_URI}
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
  data:
    redis:
      host: ${ORDER_REDIS_HOST}
      port: ${ORDER_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}

order:
  messaging:
    enabled: true
  outbox:
    relay:
      enabled: true
  pricing:
    base-url: ${CATALOG_PRICING_BASE_URL}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis,kafka
