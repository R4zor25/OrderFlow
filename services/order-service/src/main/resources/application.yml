spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ORDER_JWT_ISSUER_URI:http://localhost:8180/realms/orderflow}
          jwk-set-uri: ${ORDER_JWT_JWK_SET_URI:http://localhost:8180/realms/orderflow/protocol/openid-connect/certs}
      client:
        registration:
          catalog-pricing:
            provider: keycloak
            client-id: order-service
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: pricing.quote
        provider:
          keycloak:
            token-uri: ${ORDER_TOKEN_URI:http://localhost:8180/realms/orderflow/protocol/openid-connect/token}
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: order-service
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 2000
      validation-timeout: 1000
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  flyway:
    schemas: orders
    default-schema: orders
    locations: classpath:db/migration/orders
  kafka:
    consumer:
      group-id: order-service
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: record
    producer:
      key-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      value-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

server:
  shutdown: graceful
  port: 8082

order:
  http:
    max-request-body-size: 64KB
  saga:
    pending-timeout: 15m
    timeout-sweep-cron: "0 * * * * *"
  health:
    kafka:
      timeout: 2s
  messaging:
    error:
      retry-interval: 1s
      retry-count: 3
      dlt-send-timeout: 10s
  retention:
    cron: "0 0 3 * * *"
    outbox: 7d
    processed-events: 14d
    batch-size: 1000
  outbox:
    relay:
      ack-timeout: 10s
  idempotency:
    ttl: 24h
    in-progress-lease: 60s
  pricing:
    base-url: ${CATALOG_PRICING_BASE_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s
    resilience:
      max-attempts: 2
      initial-wait: 100ms
      backoff-multiplier: 2
      jitter-factor: 0.2
      sliding-window-size: 10
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      open-wait: 10s
      half-open-permitted-calls: 2

logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    propagation:
      type: w3c
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
