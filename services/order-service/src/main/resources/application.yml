spring:
  application:
    name: order-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  flyway:
    schemas: orders
    default-schema: orders
    locations: classpath:db/migration/orders

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
