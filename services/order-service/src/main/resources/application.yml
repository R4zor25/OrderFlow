spring:
  application:
    name: order-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  flyway:
    schemas: orders
    default-schema: orders
    locations: classpath:db/migration/orders

server:
  port: 8082

order:
  pricing:
    base-url: ${CATALOG_PRICING_BASE_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
