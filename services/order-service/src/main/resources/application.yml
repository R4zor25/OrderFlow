spring:
  application:
    name: order-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  flyway:
    schemas: orders
    default-schema: orders
    locations: classpath:db/migration/orders

server:
  port: 8082

order:
  idempotency:
    ttl: 24h
  pricing:
    base-url: ${CATALOG_PRICING_BASE_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s
    resilience:
      max-attempts: 2
      initial-wait: 100ms
      backoff-multiplier: 2
      jitter-factor: 0.2
      sliding-window-size: 10
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      open-wait: 10s
      half-open-permitted-calls: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
