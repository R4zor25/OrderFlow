spring:
  application:
    name: catalog-pricing-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
  flyway:
    schemas: catalog
    default-schema: catalog
    locations: classpath:db/migration/catalog

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
