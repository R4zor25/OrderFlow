spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: catalog-pricing-service
  datasource:
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
  flyway:
    schemas: catalog
    default-schema: catalog
    locations: classpath:db/migration/catalog

server:
  port: 8081
  shutdown: graceful

logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    propagation:
      consume: w3c
      produce: w3c
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
