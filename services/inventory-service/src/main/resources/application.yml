spring:
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  application:
    name: inventory-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    schemas: inventory
    default-schema: inventory
    locations: classpath:db/migration/inventory
  kafka:
    consumer:
      group-id: inventory-service
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: record
    producer:
      key-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      value-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

inventory:
  messaging:
    health:
      timeout: 2s
    error:
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 30s
      dlt-send-timeout: 10s
  outbox:
    relay:
      ack-timeout: 10s

server:
  port: 8083
  shutdown: graceful

logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: 0.1
    propagation:
      consume: w3c
      produce: w3c
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
