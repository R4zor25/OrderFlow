spring:
  datasource:
    url: ${INVENTORY_DB_URL}
    username: ${INVENTORY_DB_USERNAME}
    password: ${INVENTORY_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${INVENTORY_JWT_ISSUER_URI}
          jwk-set-uri: ${INVENTORY_JWT_JWK_SET_URI}

inventory:
  messaging:
    enabled: true
