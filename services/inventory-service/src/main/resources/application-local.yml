spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/orderflow?currentSchema=inventory
    username: orderflow
    password: ${POSTGRES_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}

inventory:
  messaging:
    enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,kafka
