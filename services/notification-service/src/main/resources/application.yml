micronaut:
  application:
    name: notification-service
  email:
    from:
      email: ${NOTIFICATION_FROM_EMAIL:notifications@orderflow.test}
  lifecycle:
    graceful-shutdown:
      enabled: true
      grace-period: 20s
  server:
    port: 8084
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          jwks:
            keycloak:
              url: "${NOTIFICATION_JWT_JWK_SET_URI:`http://localhost:8180/realms/orderflow/protocol/openid-connect/certs`}"
        claims-validators:
          issuer: "${NOTIFICATION_JWT_ISSUER_URI:`http://localhost:8180/realms/orderflow`}"

notification:
  channel: LOG
  ops-email: ${NOTIFICATION_OPS_EMAIL:ops@orderflow.test}
  messaging:
    enabled: false
    # One consumer thread per partition of each topic, so a slow record does not delay the other partitions.
    threads: 3
    retry-delay: 1s
    retry-count: 6
  delivery:
    retry-enabled: true
    retry-interval: 30s
    # A lease must outlast a whole batch: 20 sends at about 15 s worst-case SMTP time (5 s connect, read and write timeouts).
    lease: 6m
    initial-backoff: 30s
    max-backoff: 1h
    max-attempts: 10
    batch-size: 20
  retention:
    enabled: true
    cron: "0 30 3 * * *"
    # Far longer than the 7-day topic retention, because the row is also the event's deduplication record.
    period: 30d
    batch-size: 1000

kafka:
  health-timeout: 2s
  health:
    enabled: false
  consumers:
    default:
      key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto.offset.reset: earliest
  producers:
    default:
      key.serializer: org.apache.kafka.common.serialization.StringSerializer
      value.serializer: org.apache.kafka.common.serialization.StringSerializer
    notification-dlt:
      max.block.ms: 5000
      request.timeout.ms: 5000
      delivery.timeout.ms: 10000

datasources:
  default:
    maximum-pool-size: 10
    minimum-idle: 10
    connection-timeout: 2000
    validation-timeout: 1000
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true
      schemas:
        - notifications
      default-schema: notifications
      locations:
        - classpath:db/migration/notifications

javamail:
  enabled: false

endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: NEVER
  prometheus:
    enabled: true
    sensitive: false

otel:
  service:
    name: ${micronaut.application.name}
  propagators: tracecontext
  traces:
    exporter: none
    sampler: parentbased_traceidratio
    sampler.arg: 0.1
  metrics:
    exporter: none
  logs:
    exporter: none
  instrumentation:
    kafka:
      captured-headers: []
