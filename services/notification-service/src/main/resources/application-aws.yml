micronaut:
  security:
    token:
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${NOTIFICATION_JWT_JWK_SET_URI}
        claims-validators:
          issuer: ${NOTIFICATION_JWT_ISSUER_URI}

datasources:
  default:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}

notification:
  channel: LOG
  messaging:
    enabled: true

kafka:
  health:
    enabled: true
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP}

javamail:
  enabled: false
